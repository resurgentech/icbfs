syntax = "proto3";

package icbfs.v1;

option go_package = "github.com/resurgentech/icbfs/internal/pb";

// Metadata is the body of a file/symlink's dedicated <uuid>.metadata
// object — see ARCHITECTURE.md's Metadata model section. mode/uid/gid/
// nlink live here, as does xattrs, a generic name -> bytes map covering
// POSIX ACLs (under the well-known key "system.posix_acl_access",
// exactly mirroring Linux's own xattr-based ACL representation), future
// Windows ACLs (under "windows.acl"), and ordinary user xattrs — all
// just named entries, with no special-casing at the storage layer.
//
// Directories do not get one of these; they aren't hard-linkable, so
// their mode/uid/gid stay in native object metadata on the directory
// block object itself (see internal/icbfs/attr.go).
message Metadata {
  uint32 mode = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  uint32 nlink = 4;
  map<string, bytes> xattrs = 5;

  // Last-access time, nanoseconds since the Unix epoch (ROADMAP.md's
  // Part G, task G1). Unlike mtime, this has no free ride from the
  // object store (mtime is derived from the content object's own
  // LastModified) — atime needs real, explicit storage, and real,
  // explicit strict semantics: every read updates it, by direct
  // decision, accepting the cost of a metadata write on every read
  // rather than a relatime-style approximation.
  int64 atime_unix_nano = 6;

  // The device number (encoded major/minor, same packing mknod(2)/
  // stat(2)'s st_rdev uses) for a char/block device entry (ROADMAP.md's
  // Part G, task G2) — meaningless and always 0 for every other entry
  // type, including the FIFO/socket special files task G2 also adds
  // (neither has a device number at all).
  uint32 rdev = 7;
}
