syntax = "proto3";

package icbfs.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/resurgentech/icbfs/internal/pb";

// Metadata is the body of an item's <uuid>.metadata object (files,
// symlinks and directories alike): everything about it but its content.
// See docs/architecture.md's Metadata section.
//
// Users' extended attributes and icbfs's own state are kept apart:
// xattrs holds only what users set, and icbfs's state has fields of its
// own (windows, posix_acl_*, app), so no xattr call can see or change it.
message Metadata {
  uint32 mode = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  uint32 nlink = 4;

  // The item's extended attributes, as a mount's getxattr and setxattr
  // see them: only names users set (user.*, trusted.*, security.*).
  map<string, bytes> xattrs = 5;

  reserved 6;

  // The device number (encoded major/minor, same packing mknod(2)/
  // stat(2)'s st_rdev uses) for a char/block device entry — meaningless
  // and always 0 for every other entry type, including FIFOs and sockets
  // (neither has a device number at all).
  uint32 rdev = 7;

  reserved 8, 9;

  // The content object's ETag when mtime_override was set.
  // The override only applies while the content is still that version:
  // a later real write changes the ETag, so mtime goes back to following
  // the content — as touch -t followed by an append does on any POSIX
  // filesystem or NTFS — with no extra work on the write path itself.
  string mtime_override_etag = 10;

  // Named data streams (Windows alternate data streams): stream name ->
  // stream id. Each stream's bytes live in their own object,
  // <uuid>.ads.<id>; ids come from next_stream_id and are never reused,
  // so a renamed or recreated stream never collides with a stale write
  // to an old one. Invisible to POSIX access; deleted with the file or
  // directory that owns them.
  map<string, uint64> streams = 11;
  uint64 next_stream_id = 12;

  // Last-access time; unset = never accessed.
  google.protobuf.Timestamp atime = 13;

  // An explicit last-write-time override, set only by an explicit
  // SetFileTime/utimensat-style call, never by a content write (which
  // gets its mtime from the content object's own LastModified). Unset
  // means "no override". For a file it only applies while the content is
  // still the version named by mtime_override_etag. For a directory it
  // is the directory's mtime, set at creation. winfsp-tests'
  // setfileinfo_test sets an arbitrary historical time with no write at
  // all and expects it back exactly.
  google.protobuf.Timestamp mtime_override = 14;

  // An explicit creation-time override (SetFileTime's CreationTime);
  // unset = the time embedded in the UUIDv7 key.
  google.protobuf.Timestamp btime_override = 15;

  // Last status change (POSIX ctime): set by every change to this
  // object except a read's atime update, which would otherwise make
  // every read look like a change. A directory's is also set when an
  // entry is added to or removed from it. For a file the reported ctime
  // is the later of this and the content's last write. Unset = this
  // object's own LastModified.
  google.protobuf.Timestamp ctime = 16;

  // The item's Windows state; unset when it has none.
  Windows windows = 17;

  // The item's POSIX ACLs, in Linux's xattr encoding (what
  // system.posix_acl_access and system.posix_acl_default carry); empty
  // for none.
  bytes posix_acl_access = 18;
  bytes posix_acl_default = 19;

  // Data icbfs's own tools keep about the item, keyed "<tool>.<name>":
  // the drive API's content type and copy origin, the side store's
  // metadata. No mount shows it.
  map<string, bytes> app = 20;

  // layout is this format: 1. A reader refuses any other (internal/icbfs's
  // ErrNewerFormat for a newer one).
  uint32 layout = 21;

  // The checksums of the content's versions, by each version's ETag:
  // computed as a write's bytes went by, or later, on demand. A version
  // without an entry has none yet.
  map<string, Checksums> checksums = 22;

  // Whether the item has a .version record (internal/objstore's dates):
  // set by any write made under a declared time, which is what writes
  // one, and never cleared. A reader that wants a version's date reads
  // .version only when it's set.
  bool dated = 23;
}

// Checksums are a content version's MD5 and SHA-256; either may be empty
// (not computed).
message Checksums {
  bytes md5 = 1;
  bytes sha256 = 2;
}

// Windows is an item's Windows state.
message Windows {
  // The security descriptor, as SDDL ("O:...G:...D:...").
  string sddl = 1;
  // The ReadOnly, Hidden, System and Archive bits, when they were set.
  optional uint32 attributes = 2;
  // A non-symlink reparse point's buffer, exactly as given.
  bytes reparse = 3;
  // A symlink made as a Windows directory symlink
  // (SYMBOLIC_LINK_FLAG_DIRECTORY), which Windows treats as a directory.
  bool dir_symlink = 4;
}
