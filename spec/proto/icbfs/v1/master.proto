syntax = "proto3";

package icbfs.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/resurgentech/icbfs/internal/pb";

// FilesystemEntry is one slot in the MasterBlock's list. An empty Name
// means this slot is free, available for reuse by a later Create — see
// docs/architecture.md's master block section. A
// filesystem's ID is its position (index) in MasterBlock.filesystems,
// not a field stored here at all.
message FilesystemEntry {
  string name = 1;
  uint64 size = 2;
  bool archived = 3;
  // primary_windows: set once at creation, immutable afterward — see
  // docs/architecture.md's "Windows compatibility: primary mode"
  // section. false (the default) means primary-POSIX.
  bool primary_windows = 4;
  // max_file_size: the largest file this filesystem holds, in bytes; set
  // once at creation, immutable afterward. 0 (filesystems created before
  // this field) means the default, 1 TiB.
  uint64 max_file_size = 5;
  // created: when the filesystem was created (unset for filesystems
  // created before this field).
  google.protobuf.Timestamp created = 6;
  // dir_block_entries: how many entries a directory block holds (or, for
  // a block over others, how many blocks it points to) before it splits;
  // set once at creation. More means fewer requests per lookup and
  // listing, and larger blocks rewritten per change. 0 (filesystems
  // created before this field) means the default, 128.
  uint32 dir_block_entries = 7;
}

// MasterBlock is the body of the one, fixed, well-known master-block
// object per bucket. The list can only ever grow in length, never
// shrink or reorder — a deleted filesystem's entry is blanked in place
// (Name = ""), not removed, since removing it would shift every later
// entry's position, and therefore its ID, out from under objects that
// are already permanently keyed with the old one.
message MasterBlock {
  repeated FilesystemEntry filesystems = 1;
}
